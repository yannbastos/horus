[project]
name = "horus-backend"
version = "0.1.0"
description = "API local e execução técnica de tarefas do Hórus"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]
bundle = ["pyinstaller>=6.12,<7"]
measure = ["psutil>=7,<8"]

[project.scripts]
horus-backend = "horus_backend.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/horus_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
